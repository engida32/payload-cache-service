services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/payload_cache.db
    volumes:
      - payload-cache-data:/data

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload_cache
    ports:
      - "5432:5432"
    volumes:
      - payload-cache-pg:/var/lib/postgresql/data

volumes:
  payload-cache-data:
  payload-cache-pg:
